# gitleaks configuration, used by the shared security workflow
# (OpenVibers/OpenVibe.Shared/.github/workflows/security.yml). The default rules stay on; every
# allowlist below is one proven false positive, matched on path AND value so nothing else is hidden.
[extend]
useDefault = true

[[allowlists]]
description = "Sentinel provider key in the auth test that asserts secrets are never returned"
condition = "AND"
paths = ['''^test/auth\.test\.js$''']
regexes = ['''^sk-test-THIS-MUST-NEVER-BE-RETURNED-0123456789$''']

[[allowlists]]
description = "Made-up provider key in test/credentials.test.js (a person's own key is stored and used; the value is a placeholder, not a secret)"
condition = "AND"
paths = ['''^test/credentials\.test\.js$''']
regexes = ['''sk-test-dana-0123456789WXYZ''']

[[allowlists]]
description = "Made-up provider key in test/provider-responses.test.js (asserts the key never reaches a thrown error; a placeholder, not a secret)"
condition = "AND"
paths = ['''^test/provider-responses\.test\.js$''']
regexes = ['''^sk-resp-secret-0123456789$''']
