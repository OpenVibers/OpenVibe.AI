## ═══════════════════════════════════════════════════════════════
## ai.openvibe.network — Nginx Configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/ai.openvibe.network.conf — keep them in sync, and reload
## nginx after changing it. The domain keeps its OpenVibe.Sites placeholder until the launch rule in
## README.md is met; this vhost is what replaces it then.
##
## The Node service (port 4700, systemd unit openvibe-ai) serves:
##   /api/health, /api/ready
##   /metrics    Prometheus text, answered only to direct loopback callers (never proxied)
##   /api/v1/*   service-to-service API (Network service tokens, audience openvibe.ai). Services on
##               this host call 127.0.0.1:4700 directly, so the public vhost refuses it; open the
##               location below only when a service on another host needs it (it still needs a token).
## ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name ai.openvibe.network;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://ai.openvibe.network$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.openvibe.network;

    ssl_certificate     /etc/letsencrypt/live/openvibe.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.network/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/ai.openvibe.network.access.log;
    error_log  /var/log/nginx/ai.openvibe.network.error.log;

    # Inline images arrive as data URLs inside run inputs.
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /api/health { proxy_pass http://127.0.0.1:4700; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }
    location = /api/ready  { proxy_pass http://127.0.0.1:4700; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }

    # Metrics are for host-local scrapers only (http://127.0.0.1:4700/metrics).
    location = /metrics { return 404; }

    # ── Service API: host-local only (see header) ───────────
    location /api/ {
        return 403;
        # To expose it (token-guarded) to off-host services instead:
        # proxy_pass http://127.0.0.1:4700;
        # proxy_http_version 1.1;
        # proxy_set_header Host $host;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
        # proxy_read_timeout 90s;   # ?wait= holds a request up to 60 s
    }

    location = / {
        proxy_pass http://127.0.0.1:4700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    location / {
        return 404;
    }
}
