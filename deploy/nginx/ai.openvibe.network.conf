## ═══════════════════════════════════════════════════════════════
## ai.openvibe.network — Nginx Configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/ai.openvibe.network.conf — keep them in sync, and reload
## nginx after changing it. OpenVibe.AI's public origin is https://ai.openvibe.services
## (deploy/nginx/ai.openvibe.services.conf); this name answers 301 to the same path there.
## Services on this host never come through here: they call 127.0.0.1:4700 directly.
## ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name ai.openvibe.network;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://ai.openvibe.services$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.openvibe.network;

    ssl_certificate     /etc/letsencrypt/live/openvibe.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.network/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/ai.openvibe.network.access.log;
    error_log  /var/log/nginx/ai.openvibe.network.error.log;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / { return 301 https://ai.openvibe.services$request_uri; }
}
