## ═══════════════════════════════════════════════════════════════
## ai.openvibe.services — Nginx Configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/ai.openvibe.services.conf — keep them in sync, and reload
## nginx after changing it. It uses the *.openvibe.services certificate the host already holds
## (/etc/letsencrypt/live/openvibe.services/); installed in place of the OpenVibe.Sites placeholder
## vhost of the same name, it replaces that placeholder. ai.openvibe.network (its own vhost) answers
## 301 to here.
##
## The Node service (port 4700, systemd unit openvibe-ai) serves:
##   /           the product home for a browser (server/home.js), the text API index for anything else
##   /stats      public price and latency per provider and model (server-rendered, no sign-in)
##   /shared/*   the home's OpenVibe Frame files (content-addressed); /robots.txt, /sitemap.xml, /llms.txt
##   /api/health, /api/ready
##   /api/v1/{chat,generate,summarize,classify,extract,embed} (POST) and /api/v1/runs/:id (GET)
##               developer apps (ai.app.run, app tokens from OpenVibe.Network): open here, rate-limited
##               per address; the app checks the token on every request
##   /api/v1/*   everything else is service-to-service (first-party service tokens). Services on this
##               host call 127.0.0.1:4700 directly, so the public vhost refuses it.
##   /metrics    Prometheus text, answered only to direct loopback callers (never proxied)
##   /console    the operator console (server-rendered, OpenVibe.Network staff only) and /auth/* its
##               Network sign-in (redirect URI https://ai.openvibe.services/auth/callback, OAuth client
##               `ai`); both noindex. /robots.txt keeps crawlers out of them.
## ═══════════════════════════════════════════════════════════════

# Developer-app calls per client address (after realip): a burst for interactive use, then 5 a second.
limit_req_zone $binary_remote_addr zone=ovai_apps:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name ai.openvibe.services;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://ai.openvibe.services$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.openvibe.services;

    ssl_certificate     /etc/letsencrypt/live/openvibe.services/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.services/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/ai.openvibe.services.access.log;
    error_log  /var/log/nginx/ai.openvibe.services.error.log;

    # Inline images arrive as data URLs inside run inputs.
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /api/health { proxy_pass http://127.0.0.1:4700; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }
    location = /api/ready  { proxy_pass http://127.0.0.1:4700; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }

    # Metrics are for host-local scrapers only (http://127.0.0.1:4700/metrics).
    location ~* ^/metrics(/|$) { return 404; }

    # ── Developer apps (ai.app.run): the six direct operations and a run read ──
    location ~ ^/api/v1/(chat|generate|summarize|classify|extract|embed)$ {
        limit_req zone=ovai_apps burst=20 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:4700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;          # client address from $remote_addr only (realip),
        proxy_set_header X-Forwarded-For $remote_addr;    # never appended to or passed through
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;   # ?wait= holds a request up to 60 s
    }
    location ~ ^/api/v1/runs/[A-Za-z0-9_-]+$ {
        limit_req zone=ovai_apps burst=20 nodelay;
        limit_req_status 429;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:4700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Service API: host-local only (see header) ───────────
    location /api/ {
        return 403;
        # To expose it (token-guarded) to off-host services instead:
        # proxy_pass http://127.0.0.1:4700;
        # proxy_http_version 1.1;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;          # client address from $remote_addr only (realip),
        # proxy_set_header X-Forwarded-For $remote_addr;    # never appended to or passed through
        # proxy_set_header CF-Connecting-IP $remote_addr;
        # proxy_set_header X-Forwarded-Proto $scheme;
        # proxy_read_timeout 90s;   # ?wait= holds a request up to 60 s
    }

    # ── Operator console and its Network sign-in (staff only; the app refuses everyone else) ──
    location /console {
        proxy_pass http://127.0.0.1:4700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /auth/ {
        proxy_pass http://127.0.0.1:4700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /robots.txt { proxy_pass http://127.0.0.1:4700; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }

    location = /stats { proxy_pass http://127.0.0.1:4700; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:4700; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }
    location = /llms.txt { proxy_pass http://127.0.0.1:4700; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }
    location = /release.json { proxy_pass http://127.0.0.1:4700; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }
    location /shared/ { proxy_pass http://127.0.0.1:4700; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }

    location = / {
        proxy_pass http://127.0.0.1:4700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    # Everything else: the app answers GET/HEAD (its /favicon.ico, and its own 404 page with lang and the Frame for
    # browsers, a problem+json for API clients); other methods are refused here.
    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:4700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
